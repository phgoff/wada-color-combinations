<script>
const DATA = JSON.parse(document.getElementById('wada-data').textContent);
const COLORS = DATA.colors;
const PALETTES = DATA.palettes;
window.WADA = { colors: COLORS, palettes: PALETTES };

// weights
const WEIGHTS = {2:[62,38],3:[52,30,18],4:[42,27,18,13]};
function weightsFor(n, id){ const w=WEIGHTS[n]; const rot=id % n; return w.map((_,i)=>w[(i+rot)%n]); }

// favorites
const FAVKEY='wada:favorites';
let favs=new Set(JSON.parse(localStorage.getItem(FAVKEY)||'[]'));
function saveFavs(){ localStorage.setItem(FAVKEY, JSON.stringify([...favs])); document.getElementById('favcount').textContent=favs.size; }
function toggleFav(id){ if(favs.has(id)) favs.delete(id); else favs.add(id); saveFavs(); }
saveFavs();

// filters
const q=document.getElementById('q');
const countSel=document.getElementById('count');
const swatchSel=document.getElementById('swatch');
// populate swatch options
const swatchNames=['Swatch A','Swatch B','Swatch C','Swatch D','Swatch E','Swatch F'];
for(let i=0;i<6;i++){ const o=document.createElement('option'); o.value=i; o.textContent=swatchNames[i]; swatchSel.appendChild(o); }

function matches(p){
  const query=q.value.trim().toLowerCase();
  const c=countSel.value;
  const s=swatchSel.value;
  const favonly=document.getElementById('favonly').dataset.active==='1';
  if(c!=='all' && p.count!==Number(c)) return false;
  if(s!=='all'){
    // palette contains a color from that swatch collection
    const has=p.colorIndices.some(i=>COLORS[i].swatch===Number(s));
    if(!has) return false;
  }
  if(favonly && !favs.has(p.id)) return false;
  if(query){
    const inName=p.colors.some(n=>n.toLowerCase().includes(query));
    const inHex=p.hexes.some(h=>h.toLowerCase().includes(query));
    if(!inName && !inHex) return false;
  }
  return true;
}
let filtered=[...PALETTES];

function recompute(){
  filtered=PALETTES.filter(matches);
  render();
}

// virtualization
const viewport=document.getElementById('viewport');
const spacer=document.getElementById('spacer');
const grid=document.getElementById('grid');
const meta=document.getElementById('meta');
let cols=3;
let rowH=92;
let gap=12;
let pad=12;
let visibleStart=0, visibleEnd=0;
let rendered=new Map();

function computeCols(){
  const w=viewport.clientWidth;
  if(w<520) cols=1;
  else if(w<900) cols=2;
  else cols=3;
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
}
function totalRows(){ return Math.ceil(filtered.length/cols); }
function rowHeight(){ return rowH+gap; }

function cardHTML(p){
  const ws=weightsFor(p.count,p.id);
  const stripes=p.hexes.map((h,i)=>`<div class="stripe" style="background:${h};flex:${ws[i]}" data-hex="${h}"></div>`).join('');
  return `<div class="card" tabindex="0" data-id="${p.id}" role="button" aria-label="palette ${p.id}">
    <button class="favbtn" data-id="${p.id}" aria-label="toggle favorite">${favs.has(p.id)?'★':'☆'}</button>
    <div class="stripes">${stripes}</div>
    <div class="card-meta"><span class="card-id">#${p.id} · ${p.count} colors</span><span class="card-names">${p.colors.join(', ')}</span></div>
  </div>`;
}

function render(){
  computeCols();
  const rh=rowHeight();
  const total=totalRows()*rh - gap + pad*2;
  spacer.style.height=total+'px';
  meta.textContent=`${filtered.length} / ${PALETTES.length}`;
  updateVisible();
}

function updateVisible(){
  const st=viewport.scrollTop;
  const vh=viewport.clientHeight;
  const rh=rowHeight();
  const overscan=3;
  const firstRow=Math.max(0, Math.floor((st-pad)/rh)-overscan);
  const lastRow=Math.min(totalRows()-1, Math.ceil((st+vh-pad)/rh)+overscan);
  const start=firstRow*cols;
  const end=Math.min(filtered.length, (lastRow+1)*cols);
  // remove out of range
  for(const [id,el] of rendered){
    const idx=filtered.findIndex(p=>p.id===id);
    if(idx<start || idx>=end){ el.remove(); rendered.delete(id); }
  }
  // add
  const frag=document.createDocumentFragment();
  for(let i=start;i<end;i++){
    const p=filtered[i];
    if(rendered.has(p.id)) continue;
    const div=document.createElement('div');
    div.innerHTML=cardHTML(p);
    const el=div.firstElementChild;
    el.style.position='absolute';
    // position via grid? We use absolute rows
    const row=Math.floor(i/cols);
    const col=i%cols;
    // compute left/top based on grid columns width
    // simpler: use CSS grid by appending to rows? We'll instead position absolute with percentage widths
    // Use a flex grid container with absolute items is complex. Switch approach: render rows as containers.
    // We'll handle below instead.
    frag.appendChild(el);
  }
  // Instead of absolute per card, rebuild row containers.
}

// Rework: virtualize by rows, each row is a grid container with fixed height.
let rowEls=new Map();
function render2(){
  computeCols();
  const rh=rowHeight();
  const total=totalRows()*rh - gap + pad*2;
  spacer.style.height=total+'px';
  meta.textContent=`${filtered.length} / ${PALETTES.length}`;
  for(const [r,el] of rowEls){ el.remove(); }
  rowEls.clear();
  updateVisible2();
}
function updateVisible2(){
  const st=viewport.scrollTop;
  const vh=viewport.clientHeight;
  const rh=rowHeight();
  const overscan=2;
  const firstRow=Math.max(0, Math.floor((st-pad)/rh)-overscan);
  const lastRow=Math.min(totalRows()-1, Math.ceil((st+vh-pad)/rh)+overscan);
  // remove
  for(const [r,el] of rowEls){
    if(r<firstRow || r>lastRow){ el.remove(); rowEls.delete(r); }
  }
  for(let r=firstRow;r<=lastRow;r++){
    if(rowEls.has(r)) continue;
    const row=document.createElement('div');
    row.className='vrow';
    row.style.cssText=`position:absolute;left:${pad}px;right:${pad}px;top:${pad+r*rh}px;height:${rowH}px;display:grid;grid-template-columns:repeat(${cols},1fr);gap:${gap}px;`;
    const start=r*cols;
    for(let c=0;c<cols;c++){
      const i=start+c;
      if(i>=filtered.length) break;
      const p=filtered[i];
      const div=document.createElement('div');
      div.innerHTML=cardHTML(p);
      row.appendChild(div.firstElementChild);
    }
    spacer.appendChild(row);
    rowEls.set(r,row);
  }
}
// replace render
render=render2;
updateVisible=updateVisible2;

// events
viewport.addEventListener('scroll', ()=>requestAnimationFrame(updateVisible2), {passive:true});
window.addEventListener('resize', render2);
q.addEventListener('input', recompute);
countSel.addEventListener('change', recompute);
swatchSel.addEventListener('change', recompute);
document.getElementById('favonly').addEventListener('click', (e)=>{ const b=e.currentTarget; b.dataset.active = b.dataset.active==='1'?'0':'1'; b.textContent = b.dataset.active==='1'?'Favorites only: on':'Favorites only'; recompute(); });

// open drawer
const drawer=document.getElementById('drawer');
const backdrop=document.getElementById('backdrop');
function openPalette(id){
  const p=PALETTES.find(x=>x.id===id);
  if(!p) return;
  const ws=weightsFor(p.count,p.id);
  const stripes=p.hexes.map((h,i)=>`<div class="bigstripe" style="background:${h};flex:${ws[i]}"></div>`).join('');
  const rows=p.hexes.map((h,i)=>{
    const col=COLORS.find(c=>c.hex.toLowerCase()===h.toLowerCase() && c.combinations.includes(p.id)) || COLORS.find(c=>c.hex.toLowerCase()===h.toLowerCase());
    const name=col?col.name:'';
    const rgb=col?col.rgb.join(', '):'';
    const cmyk=col?col.cmyk.join(', '):'';
    return `<div class="row"><span class="k"><span class="swatchchip" style="background:${h}"></span>${name||h}</span><span class="v">${h}<br>${rgb}<br>cmyk ${cmyk}</span></div>`;
  }).join('');
  drawer.innerHTML=`
    <div class="drawer-head">
      <h2 style="margin:0;font-size:14px;">Palette #${p.id} · ${p.count} colors</h2>
      <button class="drawer-close" aria-label="close">×</button>
    </div>
    <div class="bigstripes">${stripes}</div>
    <div class="actions">
      <button data-act="copycss">Copy CSS vars</button>
      <button data-act="copyjson">Copy JSON</button>
      <button data-act="fav">${favs.has(p.id)?'Unfavorite':'Favorite'}</button>
    </div>
    ${rows}
    <p class="help">colors: ${p.colors.join(', ')}</p>
  `;
  drawer.classList.add('open'); backdrop.classList.add('open');
  drawer.querySelector('.drawer-close').onclick=closeDrawer;
  drawer.querySelector('[data-act="copycss"]').onclick=()=>{ copyText(exportCSS(p)); };
  drawer.querySelector('[data-act="copyjson"]').onclick=()=>{ copyText(JSON.stringify({id:p.id,colors:p.hexes,names:p.colors},null,2)); };
  drawer.querySelector('[data-act="fav"]').onclick=(e)=>{ toggleFav(p.id); e.target.textContent=favs.has(p.id)?'Unfavorite':'Favorite'; recompute(); };
  location.hash='#'+p.id;
}
function closeDrawer(){ drawer.classList.remove('open'); backdrop.classList.remove('open'); history.replaceState(null,'',location.pathname+location.search); }
backdrop.onclick=closeDrawer;
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeDrawer();
});
// card clicks via delegation
spacer.addEventListener('click', e=>{
  const favBtn=e.target.closest('.favbtn');
  if(favBtn){ e.stopPropagation(); const id=Number(favBtn.dataset.id); toggleFav(id); favBtn.textContent=favs.has(id)?'★':'☆'; recompute(); return; }
  const card=e.target.closest('.card');
  if(card) openPalette(Number(card.dataset.id));
});
spacer.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const card=e.target.closest('.card'); if(card) openPalette(Number(card.dataset.id)); }
});

function exportCSS(p){
  return p.hexes.map((h,i)=>`--color-${i+1}: ${h};`).join('\n');
}

function copyText(t){
  navigator.clipboard.writeText(t).then(()=>toast('copied'));
}
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1200); }

// export favorites
document.getElementById('export').onclick=()=>{
  const out=PALETTES.filter(p=>favs.has(p.id)).map(p=>({id:p.id,colors:p.hexes,names:p.colors}));
  copyText(JSON.stringify(out,null,2));
};

// agent API
window.wada = {
  getPalette: id => PALETTES.find(p=>p.id===id),
  search: q => PALETTES.filter(p=>p.colors.some(n=>n.toLowerCase().includes(q.toLowerCase())) || p.hexes.some(h=>h.toLowerCase().includes(q.toLowerCase()))),
  exportPalette: (id,fmt='json') => {
    const p=PALETTES.find(x=>x.id===id); if(!p) return null;
    if(fmt==='css') return exportCSS(p);
    return {id:p.id,colors:p.hexes,names:p.colors};
  },
  favorites: ()=>[...favs],
};

// viewport height follows header
const header=document.querySelector('header');
function adjustViewport(){ viewport.style.height=(window.innerHeight-header.offsetHeight)+'px'; }
adjustViewport(); window.addEventListener('resize', adjustViewport);

// no auto-open drawer on refresh
if(location.hash){ history.replaceState(null,'',location.pathname+location.search); }
recompute();
</script>
</body>
</html>
